upstream web { server web:3000; keepalive 32; }
upstream api { server backend:8000; keepalive 32; }

# Micro-cache for public pages (HTML). A page looks the same for every visitor (the language comes from the URL and
# the sign-in state lives in the browser), so caching it for 60 s turns a traffic spike into one render per page
# per minute. Cabinets, admin and login pages and Next.js client navigations (RSC requests) are never cached.
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=512m inactive=30m use_temp_path=off;
# Two cached copies per page at most: gzip-compressed (almost every browser) and plain. The upstream compresses a
# page once per minute instead of nginx compressing every response.
map $http_accept_encoding $page_encoding {
  default "";
  "~*gzip" gzip;
}
map $request_uri $page_cache_skip {
  default 0;
  "~^/((uz|ru|en)/)?(admin|dashboard|partner|login|register)(/|\?|$)" 1;
}

server {
  listen 80;
  server_name medmapp.uz www.medmapp.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name medmapp.uz www.medmapp.uz;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 30m;   # MAX_UPLOAD_MB=25 + multipart overhead

  # Compress text responses (API JSON, HTML, JS, CSS); images are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

  # Public media only (hospital photos, blog images). Private medical files are not in this volume.
  location /media/  { alias /srv/media/;  expires 7d; access_log off; }
  location /static/ { alias /srv/static/; expires 30d; access_log off; }

  # Django: API, Django admin, API docs
  location ~ ^/(api|django-admin|swagger|redoc)(/|$) {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Everything else: Next.js (site, /dashboard, /admin, /partner)
  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Accept-Encoding $page_encoding;
    proxy_cache pages;
    proxy_cache_key "$scheme$host$request_uri|$page_encoding";
    proxy_cache_bypass $page_cache_skip $http_rsc $http_next_action;
    proxy_no_cache $page_cache_skip $http_rsc $http_next_action;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;                     # one render per page while many visitors wait for it
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;            # only the i18n NEXT_LOCALE cookie (language detection is off)
    # add_header here replaces the server-level ones for this location, so repeat the security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Page-Cache $upstream_cache_status always;
  }
}
