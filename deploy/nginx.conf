upstream web { server web:3000; }
upstream api { server backend:8000; }

server {
  listen 80;
  server_name medmapp.uz www.medmapp.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name medmapp.uz www.medmapp.uz;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 30m;   # MAX_UPLOAD_MB=25 + multipart overhead

  # Compress text responses (API JSON, HTML, JS, CSS); images are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

  # Public media only (hospital photos, blog images). Private medical files are not in this volume.
  location /media/  { alias /srv/media/;  expires 7d; access_log off; }
  location /static/ { alias /srv/static/; expires 30d; access_log off; }

  # Django: API, Django admin, API docs
  location ~ ^/(api|django-admin|swagger|redoc)(/|$) {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Everything else: Next.js (site, /dashboard, /admin, /partner)
  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
