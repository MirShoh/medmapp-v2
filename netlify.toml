# Netlify: hosts the Next.js site (web/). The Django API runs elsewhere; point BACKEND_URL at it
# (Site configuration -> Environment variables). Guide: docs/NETLIFY.md
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"
  # Skip a deploy when nothing under web/ changed (backend-only commits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
